    const formatLocation = (coords) => {
      if (!coords) return '';
      return `Lat: ${coords.latitude.toFixed(4)}, Lon: ${coords.longitude.toFixed(4)}`;

    // --- Main Application Component (Converted to React.createElement) ---
    function App() {
      const [lang, setLang] = useState('en');
      const T = useMemo(() => i18n[lang], [lang]);

      // Auth State
      const [user, setUser] = useState(null);
      const [isAuthReady, setIsAuthReady] = useState(false);
      const [isNewCustomer, setIsNewCustomer] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [authCreds, setAuthCreds] = useState({ email: '', password: '' });
      const [authError, setAuthError] = useState('');
      const [authMessage, setAuthMessage] = useState('');

      // App State
      const [view, setView] = useState('booking');
      const [step, setStep] = useState(1);
      const [isLoading, setIsLoading] = useState(false);
      const [geolocationStatus, setGeolocationStatus] = useState(null);
      const [bookingToCancel, setBookingToCancel] = useState(null);
      const [modalMessage, setModalMessage] = useState('');

      const bookingSectionRef = useRef(null);

      // Booking Data State
      const [bookingData, setBookingData] = useState({
        serviceId: SERVICES[0].id,
        date: '',
        time: '',
        address: '',
        city: '',
        state: '',
        zip: '',
        coords: null,
      });
      const [userBookings, setUserBookings] = useState([]);

      // Firebase Auth Listener
      useEffect(() => {
        if (!auth) return;
        
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          setIsAuthReady(true);
          setIsLoading(false);
        });

        return () => unsubscribe();
      }, []);

      // Check if user is new customer
      useEffect(() => {
        if (user && userBookings.length === 0) {
          setIsNewCustomer(true);
        } else {
          setIsNewCustomer(false);
        }
      }, [user, userBookings]);

      // Selected service
      const selectedService = useMemo(() => {
        return SERVICES.find(s => s.id === bookingData.serviceId) || SERVICES[0];
      }, [bookingData.serviceId]);

      // Calculate costs
      const bookingCosts = useMemo(() => {
        const subtotal = selectedService.price;
        const isDiscountApplied = isNewCustomer;
        const discount = isDiscountApplied ? subtotal * 0.1 : 0;
        const finalPrice = subtotal - discount;
        
        return { subtotal, discount, finalPrice, isDiscountApplied };
      }, [selectedService, isNewCustomer]);

      // Scroll to booking section
      const scrollToBooking = useCallback(() => {
        if (bookingSectionRef.current) {
          bookingSectionRef.current.scrollIntoView({ behavior: 'smooth' });
        }
        setView('booking');
      }, []);

      // Handle geolocation
      const handleGeolocation = useCallback(() => {
        if (!navigator.geolocation) {
          setGeolocationStatus('fail');
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (position) => {
            setBookingData(prev => ({
              ...prev,
              coords: {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude
              }
            }));
            setGeolocationStatus('success');
          },
          (error) => {
            console.error('Geolocation error:', error);
            setGeolocationStatus('fail');
          }
        );
      }, []);

      // Handle next step
      const handleNextStep = useCallback(() => {
        if (step < 4) {
          setStep(prev => prev + 1);
        }
      }, [step]);

      // Handle back step
      const handleBackStep = useCallback(() => {
        if (step > 1) {
          setStep(prev => prev - 1);

            e(CheckCircle, { size: 20 }),
            e('span', { className: "font-medium" }, modalMessage),
            e('button', { onClick: () => setModalMessage(''), className: "ml-4" }, e(X, { size: 20 }))
          )
        ),
        e(Header, null),
        e(LandingSection, { user: user }),
        e('main', { ref: bookingSectionRef, id: "booking-section", className: "container mx-auto p-4 py-8 max-w-4xl" },
          !user && view !== 'login' && e('div', { className: "text-center mb-8 p-6 bg-emerald-50 rounded-xl border border-emerald-200" },
            e('p', { className: "text-lg text-emerald-800 font-medium" }, "Please log in or create an account to manage your bookings!"),
            e('button', {
              onClick: () => setView('login'),
              className: "mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-6 rounded-xl transition shadow-md"
            }, T.loginTitle)
          ),
          view === 'login' && e(AuthView, null),
          view === 'dashboard' && user && e(MyBookingsView, null),
          view === 'booking' && e('div', { className: "bg-white p-6 md:p-10 rounded-2xl shadow-2xl border border-gray-100" },
            e(BookingFlowContainer, null)
          )
        )
      );
    }

    // Render the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App, null));
  </script>
</body>
</html>
